# --- TOI UU HIEU NANG CHO 100+ USER ---

# 1. Tang so luong ket noi Database toi da (Mac dinh la 10)
# Giup nhieu nguoi cung chat va luu vao DB cung luc ma khong phai xep hang cho
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# 2. Tang so luong xu ly cua Server (Mac dinh 200 -> Tang len cho chac)
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10

# 3. Gioi han kich thuoc tin nhan WebSocket (Tranh ai do gui van ban dai ca trang A4 gay lag)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 4. Cau hinh JPA de toi uu hieu nang
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
